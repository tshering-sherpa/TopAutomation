# CORE settings shared by every module (web, mobile, api, security)
# Override any value with -Dname=value or an environment variable.
env=qa
explicit.wait.seconds=10
# re-run a failed test this many times (security tests are never retried)
retry.count=1
screenshot.on.failure=true
# each module writes to its OWN <module>/target/reports and <module>/target/logs
report.dir=target/reports
