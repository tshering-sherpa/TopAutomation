# API module settings
api.base.url=https://restful-booker.herokuapp.com
api.base.path=
api.timeout.ms=15000
api.relaxed.https=false
api.testdata.file=src/test/resources/testdata/api-testdata.xlsx

# Auth: token is fetched once per run by AuthManager and sent as   <header>: <prefix><token>
api.auth.login.path=/auth
api.auth.username=admin
api.auth.password=password123
api.auth.username.field=username
api.auth.password.field=password
api.auth.token.jsonpath=token
# restful-booker wants "Cookie: token=<t>".  For Bearer tokens use header=Authorization, prefix=Bearer
api.auth.header=Cookie
api.auth.prefix=token=
