# MOBILE module settings (Appium)
platform=android
appium.server.url=http://127.0.0.1:4723
# true = the framework starts a LOCAL Appium server for you (needs `appium` installed via npm)
appium.server.autostart=false
mobile.no.reset=false
mobile.testdata.file=src/test/resources/testdata/mobile-testdata.xlsx

# ---- Android (put the .apk in topautomation-mobile/apps/) ----
android.device.name=emulator-5554
android.platform.version=
android.app=apps/sample.apk
# or, for an app already installed on the device (leave android.app blank then):
android.app.package=
android.app.activity=

# ---- iOS (simulator .app or signed .ipa in topautomation-mobile/apps/) ----
ios.device.name=iPhone 15
ios.platform.version=
ios.app=apps/sample.app
ios.bundle.id=
