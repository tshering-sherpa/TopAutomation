# SECURITY module settings (injection testing)
# Comma separated: SQLI,NOSQLI,XSS,HTML_INJECTION,COMMAND_INJECTION,PATH_TRAVERSAL,LDAP,SSTI,XXE,CRLF,MALFORMED,MOBILE
# (blank = all web/API categories; the mobile run adds the MOBILE category by default)
payload.categories=
# Cap payloads per category (0 = no limit). Handy for quick runs.
payload.max.per.category=0
# Same cap, API injection run only (0 = fall back to payload.max.per.category)
api.payload.max.per.category=0
# A sleep/delay payload that makes the response slower than this is flagged as possible time-based injection
security.time.threshold.ms=4500
